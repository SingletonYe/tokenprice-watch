name: Daily price snapshot and deploy

# The site's whole value proposition is that it is current. This workflow is the
# guarantee: every day it re-collects pricing, writes a dated snapshot + diff,
# rebuilds the static site, runs the quality gate, commits the data (which is the
# permanent price history), and publishes to GitHub Pages.
#
# No secrets, no API keys, no dependencies to install — the collector and the
# builder are standard-library Python.

on:
  schedule:
    # 06:17 UTC daily — deliberately off the hour, since cron peaks on :00.
    # A second, later slot is deliberate redundancy: GitHub occasionally delays or
    # drops scheduled runs under load (it dropped 2026-10-18's run), and the
    # pipeline is idempotent, so a duplicate run recomputes the same day-to-day
    # diff and redeploys the same content.
    - cron: "17 6 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually?"
        required: false
        default: "manual run"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Collect today's snapshot and diff
        run: python3 src/fetch_data.py
        # aborts without writing anything if upstream returns an implausible payload

      - name: Build the static site
        run: |
          python3 src/build_site.py --out site \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --path-prefix "${{ steps.pages.outputs.base_path }}"

      - name: Quality gate
        run: python3 src/qa_check.py --out site --path-prefix "${{ steps.pages.outputs.base_path }}"

      - name: Commit the data (the permanent price history)
        run: |
          git config user.name  "tokenprice-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore(data): daily snapshot $(date -u +%F)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
